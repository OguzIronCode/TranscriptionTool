<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yeni Şifre — Transkript Aracı</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .card { padding: 1.875rem; }
  .card .inp { padding-right: 2.6rem; }
  .invalid-card { padding: 2rem; text-align: center; }
  .invalid-card p { color: var(--text-2); font-size: .875rem; margin-bottom: 1rem; }
  .invalid-card a { color: var(--accent); text-decoration: none; font-size: .875rem; }
</style>
</head>
<body class="auth-body">

<button class="theme-btn theme-fixed" id="theme-btn" title="Gece/gündüz modu">
  <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="auth-wrap">
  <div class="auth-brand">
    <div class="auth-icon">🎙️</div>
    <h1>Transkript Aracı</h1>
    <p>Yeni şifrenizi belirleyin</p>
  </div>

  <div class="card auth-card" id="form-card">
    <p class="auth-title">Yeni Şifre Belirle</p>

    <div class="field">
      <label class="field-label" for="password">Yeni şifre</label>
      <div class="inp-wrap">
        <input class="inp" type="password" id="password" placeholder="En az 6 karakter" autocomplete="new-password">
        <button class="eye-btn" id="eye-btn" type="button" tabindex="-1">
          <svg id="eye-on" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eye-off" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <div class="strength-bar" id="sbar"><span></span><span></span><span></span><span></span></div>
      <p class="strength-hint" id="shint"></p>
    </div>

    <div class="field">
      <label class="field-label" for="confirm">Şifre tekrar</label>
      <input class="inp" type="password" id="confirm" placeholder="••••••••" autocomplete="new-password">
    </div>

    <button class="btn btn-primary btn-full" id="save-btn" style="margin-top:.25rem;">Şifremi Güncelle</button>
    <div id="msg" style="margin-top:.875rem;display:none;"></div>
  </div>

  <div class="card invalid-card" id="invalid-card" style="display:none">
    <p>Bu bağlantı geçersiz veya süresi dolmuş.</p>
    <a href="/forgot">Yeni sıfırlama bağlantısı iste →</a>
  </div>
</div>

<script>
let sb = null

const pw = document.getElementById('password')
document.getElementById('eye-btn').addEventListener('click', () => {
  const t = pw.type === 'text'
  pw.type = t ? 'password' : 'text'
  document.getElementById('eye-on').style.display  = t ? '' : 'none'
  document.getElementById('eye-off').style.display = t ? 'none' : ''
})

const levels = [{l:'',c:''},{l:'Zayıf',c:'weak'},{l:'Orta',c:'fair'},{l:'İyi',c:'good'},{l:'Güçlü',c:'strong'}]
function strength(p) {
  if (!p) return 0; let s=0
  if (p.length>=6) s++; if (p.length>=10) s++
  if (/[A-Z]/.test(p)&&/[a-z]/.test(p)) s++
  if (/[0-9]/.test(p)||/[^A-Za-z0-9]/.test(p)) s++
  return Math.min(s,4)
}
pw.addEventListener('input', () => {
  const s = strength(pw.value)
  document.getElementById('sbar').className = 'strength-bar ' + (levels[s].c||'')
  document.getElementById('shint').textContent = pw.value ? levels[s].l : ''
})

function showMsg(text, type) {
  const el = document.getElementById('msg')
  el.className = 'alert alert-' + type; el.textContent = text; el.style.display = 'block'
}

async function init() {
  const cfg = await fetch('/config').then(r => r.json())
  sb = supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key)
  const { data: { session } } = await sb.auth.getSession()
  if (!session) {
    document.getElementById('form-card').style.display = 'none'
    document.getElementById('invalid-card').style.display = 'block'
  }
  initTheme()
}

document.getElementById('save-btn').addEventListener('click', async () => {
  const password = pw.value
  const confirm  = document.getElementById('confirm').value
  if (!password || password.length < 6) { showMsg('Şifre en az 6 karakter olmalı.', 'err'); return }
  if (password !== confirm) { showMsg('Şifreler eşleşmiyor.', 'err'); return }

  const btn = document.getElementById('save-btn')
  btn.disabled = true
  btn.innerHTML = '<span class="spinner"></span> Güncelleniyor...'

  const { error } = await sb.auth.updateUser({ password })
  if (error) {
    showMsg(error.message, 'err')
    btn.disabled = false; btn.textContent = 'Şifremi Güncelle'
  } else {
    showMsg('Şifreniz güncellendi! Yönlendiriliyorsunuz...', 'ok')
    btn.disabled = true
    setTimeout(() => { window.location.href = '/' }, 2000)
  }
})

document.getElementById('confirm').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('save-btn').click()
})
init()
</script>
</body>
</html>
