<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayıt Ol — Transkript Aracı</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #09090b;
    --card: #111113;
    --surface: #1c1c1f;
    --border: #2e2e33;
    --border-focus: #6366f1;
    --primary: #6366f1;
    --primary-hover: #5254cc;
    --text: #fafafa;
    --text-sub: #a1a1aa;
    --text-muted: #71717a;
    --danger: #f87171;
    --success: #4ade80;
    --radius: 14px;
    --radius-sm: 9px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, #6366f115, transparent);
  }

  .wrapper {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.75rem;
  }

  .brand { text-align: center; }
  .brand-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-radius: 12px;
    display: grid; place-items: center;
    margin: 0 auto 0.75rem;
    font-size: 1.3rem;
  }
  .brand h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
  .brand p { font-size: 0.85rem; color: var(--text-sub); margin-top: 0.25rem; }

  .card {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    box-shadow: 0 0 0 1px #ffffff04, 0 8px 40px #00000060;
  }
  .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 1.5rem; }

  .field { margin-bottom: 1rem; }
  .field-label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-sub); margin-bottom: 0.4rem; }
  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text);
    padding: 0.65rem 0.875rem; font-size: 0.9rem; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s; -webkit-appearance: none;
  }
  .input-wrap input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px #6366f118; }
  .input-wrap input::placeholder { color: var(--text-muted); }
  .eye-btn {
    position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); display: flex; align-items: center;
    padding: 0; transition: color 0.15s;
  }
  .eye-btn:hover { color: var(--text-sub); }
  .input-wrap input[type="password"],
  .input-wrap input.has-eye { padding-right: 2.5rem; }

  /* Şifre güç göstergesi */
  .strength-bar {
    display: flex; gap: 4px; margin-top: 0.5rem; height: 3px;
  }
  .strength-bar span {
    flex: 1; border-radius: 99px; background: var(--border);
    transition: background 0.2s;
  }
  .strength-bar.weak span:nth-child(1) { background: #f87171; }
  .strength-bar.fair span:nth-child(1),
  .strength-bar.fair span:nth-child(2) { background: #fb923c; }
  .strength-bar.good span:nth-child(1),
  .strength-bar.good span:nth-child(2),
  .strength-bar.good span:nth-child(3) { background: #facc15; }
  .strength-bar.strong span { background: #4ade80; }
  .strength-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.3rem; }

  .btn-primary {
    width: 100%; padding: 0.72rem;
    background: var(--primary); color: #fff; border: none;
    border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.01em; margin-top: 0.25rem;
  }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-primary:active:not(:disabled) { transform: scale(0.99); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .message {
    display: none; margin-top: 0.875rem;
    padding: 0.65rem 0.875rem; border-radius: var(--radius-sm); font-size: 0.825rem;
  }
  .message.error   { background: #f8717112; border: 1px solid #f8717130; color: var(--danger); }
  .message.success { background: #4ade8012; border: 1px solid #4ade8030; color: var(--success); }

  .divider {
    display: flex; align-items: center; gap: 0.75rem;
    margin: 1.25rem 0; color: var(--text-muted); font-size: 0.8rem;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .footer-links { text-align: center; }
  .footer-links a { font-size: 0.85rem; color: var(--text-sub); text-decoration: none; transition: color 0.15s; }
  .footer-links a:hover { color: var(--text); }
  .footer-links a.primary-link { color: var(--primary); }
  .footer-links a.primary-link:hover { color: #818cf8; }

  .guest-row { text-align: center; font-size: 0.82rem; color: var(--text-muted); }
  .guest-row a { color: var(--text-muted); text-decoration: none; border-bottom: 1px dashed var(--border); transition: color 0.15s; }
  .guest-row a:hover { color: var(--text-sub); }
</style>
</head>
<body>
<div class="wrapper">

  <div class="brand">
    <div class="brand-icon">🎙️</div>
    <h1>Transkript Aracı</h1>
    <p>Ücretsiz hesap oluşturun</p>
  </div>

  <div class="card">
    <p class="card-title">Kayıt Ol</p>

    <div class="field">
      <label class="field-label" for="username">Kullanıcı adı</label>
      <div class="input-wrap">
        <input type="text" id="username" placeholder="kullaniciadi" autocomplete="username">
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="email">E-posta adresi</label>
      <div class="input-wrap">
        <input type="email" id="email" placeholder="ornek@mail.com" autocomplete="email">
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="password">Şifre</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="En az 6 karakter" autocomplete="new-password">
        <button class="eye-btn" id="eye-btn" type="button" tabindex="-1" aria-label="Şifreyi göster">
          <svg id="eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg id="eye-off-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
      <div class="strength-bar" id="strength-bar">
        <span></span><span></span><span></span><span></span>
      </div>
      <p class="strength-hint" id="strength-hint"></p>
    </div>

    <button class="btn-primary" id="register-btn">Hesap Oluştur</button>
    <div class="message" id="msg"></div>

    <div class="divider">zaten hesabın var mı?</div>

    <div class="footer-links">
      <a href="/login" class="primary-link">Giriş yap</a>
    </div>
  </div>

  <div class="guest-row">
    <a href="/">Kayıtsız devam et →</a>
  </div>

</div>

<script>
let supabaseClient = null

async function init() {
  const config = await fetch('/config').then(r => r.json())
  const { createClient } = supabase
  supabaseClient = createClient(config.supabase_url, config.supabase_anon_key)
  const { data: { session } } = await supabaseClient.auth.getSession()
  if (session) { window.location.href = '/'; return }
}

// Şifre göster/gizle
const pwInput = document.getElementById('password')
document.getElementById('eye-btn').addEventListener('click', () => {
  const isText = pwInput.type === 'text'
  pwInput.type = isText ? 'password' : 'text'
  document.getElementById('eye-icon').style.display = isText ? '' : 'none'
  document.getElementById('eye-off-icon').style.display = isText ? 'none' : ''
})

// Şifre güç göstergesi
const strengthLevels = [
  { label: '', cls: '' },
  { label: 'Zayıf', cls: 'weak' },
  { label: 'Orta', cls: 'fair' },
  { label: 'İyi', cls: 'good' },
  { label: 'Güçlü', cls: 'strong' },
]

function getStrength(pw) {
  if (!pw) return 0
  let score = 0
  if (pw.length >= 6) score++
  if (pw.length >= 10) score++
  if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++
  if (/[0-9]/.test(pw) || /[^A-Za-z0-9]/.test(pw)) score++
  return Math.min(score, 4)
}

pwInput.addEventListener('input', () => {
  const score = getStrength(pwInput.value)
  const bar = document.getElementById('strength-bar')
  const hint = document.getElementById('strength-hint')
  bar.className = 'strength-bar ' + (strengthLevels[score].cls || '')
  hint.textContent = pwInput.value ? strengthLevels[score].label : ''
})

// Mesaj
function showMsg(text, type) {
  const el = document.getElementById('msg')
  el.textContent = text
  el.className = `message ${type}`
  el.style.display = 'block'
}

document.getElementById('register-btn').addEventListener('click', async () => {
  const username = document.getElementById('username').value.trim()
  const email = document.getElementById('email').value.trim()
  const password = pwInput.value

  if (!username || !email || !password) { showMsg('Tüm alanları doldurun.', 'error'); return }
  if (password.length < 6) { showMsg('Şifre en az 6 karakter olmalı.', 'error'); return }

  const btn = document.getElementById('register-btn')
  btn.disabled = true
  btn.textContent = 'Hesap oluşturuluyor...'

  const { data, error } = await supabaseClient.auth.signUp({
    email, password,
    options: { data: { username } }
  })

  if (error) {
    showMsg(error.message, 'error')
    btn.disabled = false
    btn.textContent = 'Hesap Oluştur'
  } else if (data.session) {
    window.location.href = '/'
  } else {
    showMsg('Hesabınız oluşturuldu! E-postanızdaki doğrulama linkine tıklayın, ardından giriş yapabilirsiniz.', 'success')
    btn.disabled = false
    btn.textContent = 'Hesap Oluştur'
  }
})

pwInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('register-btn').click()
})

init()
</script>
</body>
</html>
