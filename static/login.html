<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş — Transkript Aracı</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .card { padding: 1.875rem; }
  .card .inp { padding-right: 2.6rem; }
</style>
</head>
<body class="auth-body">

<button class="theme-btn theme-fixed" id="theme-btn" title="Gece/gündüz modu">
  <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="auth-wrap">
  <div class="auth-brand">
    <div class="auth-icon">🎙️</div>
    <h1>Transkript Aracı</h1>
    <p>Kişisel arşivinize erişmek için giriş yapın</p>
  </div>

  <div class="card auth-card">
    <p class="auth-title">Giriş Yap</p>

    <div class="field">
      <label class="field-label" for="email">E-posta adresi</label>
      <input class="inp" type="email" id="email" placeholder="ornek@mail.com" autocomplete="email">
    </div>

    <div class="field">
      <label class="field-label" for="password">Şifre</label>
      <div class="inp-wrap">
        <input class="inp" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        <button class="eye-btn" id="eye-btn" type="button" tabindex="-1">
          <svg id="eye-on" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eye-off" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">
      <label class="cb-row" for="remember">
        <input type="checkbox" id="remember" checked>
        <span class="cb-box">
          <svg class="cb-check" width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="cb-label">Beni hatırla</span>
      </label>
      <a href="/forgot" style="font-size:.8rem;color:var(--text-3);text-decoration:none;transition:color .15s;" onmouseover="this.style.color='var(--text-2)'" onmouseout="this.style.color='var(--text-3)'">Şifremi unuttum</a>
    </div>

    <button class="btn btn-primary btn-full" id="login-btn">Giriş Yap</button>
    <div id="msg" style="margin-top:.875rem;display:none;"></div>

    <div class="divider">veya</div>
    <div class="auth-footer">Hesabın yok mu? <a href="/register" class="la">Kayıt ol</a></div>
  </div>

  <div class="auth-guest"><a href="/">Kayıtsız devam et →</a></div>
</div>

<script>
let sb = null

async function init() {
  const cfg = await fetch('/config').then(r => r.json())
  sb = supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key)
  const { data: { session } } = await sb.auth.getSession()
  if (session) { window.location.href = '/'; return }
  initTheme()
}

const pw = document.getElementById('password')
document.getElementById('eye-btn').addEventListener('click', () => {
  const t = pw.type === 'text'
  pw.type = t ? 'password' : 'text'
  document.getElementById('eye-on').style.display  = t ? '' : 'none'
  document.getElementById('eye-off').style.display = t ? 'none' : ''
})

document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim()
  const password = pw.value
  if (!email || !password) return

  const rem = document.getElementById('remember').checked
  localStorage.setItem('remember_me', rem ? 'true' : 'false')

  const btn = document.getElementById('login-btn')
  btn.disabled = true
  btn.innerHTML = '<span class="spinner"></span> Giriş yapılıyor...'

  const { error } = await sb.auth.signInWithPassword({ email, password })
  const msg = document.getElementById('msg')

  if (error) {
    msg.className = 'alert alert-err'
    msg.textContent = 'E-posta veya şifre hatalı.'
    msg.style.display = 'block'
    btn.disabled = false
    btn.textContent = 'Giriş Yap'
  } else {
    window.location.href = '/'
  }
})

pw.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('login-btn').click() })

init()
</script>
</body>
</html>
