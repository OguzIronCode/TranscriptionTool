<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifremi Unuttum — Transkript Aracı</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .card { padding: 1.875rem; }
</style>
</head>
<body class="auth-body">

<button class="theme-btn theme-fixed" id="theme-btn" title="Gece/gündüz modu">
  <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="auth-wrap">
  <div class="auth-brand">
    <div class="auth-icon">🎙️</div>
    <h1>Transkript Aracı</h1>
    <p>Şifrenizi sıfırlayın</p>
  </div>

  <div class="card auth-card">
    <p class="auth-title">Şifremi Unuttum</p>
    <p class="auth-desc">E-posta adresinizi girin, şifre sıfırlama bağlantısı gönderelim.</p>

    <div class="field">
      <label class="field-label" for="email">E-posta adresi</label>
      <input class="inp" type="email" id="email" placeholder="ornek@mail.com" autocomplete="email">
    </div>

    <button class="btn btn-primary btn-full" id="send-btn">Sıfırlama Bağlantısı Gönder</button>
    <div id="msg" style="margin-top:.875rem;display:none;"></div>

    <div class="divider"></div>
    <div class="auth-footer"><a href="/login" class="la">← Giriş sayfasına dön</a></div>
  </div>
</div>

<script>
let sb = null

async function init() {
  const cfg = await fetch('/config').then(r => r.json())
  sb = supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key)
  initTheme()
}

function showMsg(text, type) {
  const el = document.getElementById('msg')
  el.className = 'alert alert-' + type; el.textContent = text; el.style.display = 'block'
}

document.getElementById('send-btn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim()
  if (!email) { showMsg('E-posta adresinizi girin.', 'err'); return }

  const btn = document.getElementById('send-btn')
  btn.disabled = true
  btn.innerHTML = '<span class="spinner"></span> Gönderiliyor...'

  const redirectTo = window.location.origin + '/reset-password'
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo })

  if (error) {
    showMsg(error.message, 'err')
    btn.disabled = false; btn.textContent = 'Sıfırlama Bağlantısı Gönder'
  } else {
    showMsg('Bağlantı gönderildi! E-postanızı kontrol edin. Spam klasörünü de kontrol etmeyi unutmayın.', 'ok')
    btn.disabled = true; btn.textContent = 'Gönderildi ✓'
  }
})

document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('send-btn').click()
})
init()
</script>
</body>
</html>
