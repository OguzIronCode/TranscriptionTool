<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8">
<!-- Paylaşım görseli kaynağı: static/og.png bu dosyadan üretilir (1200x630).
     Üretim: chrome --headless --window-size=1200,630 --screenshot=static/og.png design/og.html -->
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:'Segoe UI',Arial,sans-serif;color:#e8e9f3;background:radial-gradient(900px 500px at 15% 10%,#2a3070 0%,#0e0f14 65%);display:flex;align-items:center;padding:0 90px;box-sizing:border-box}
  .logo{width:150px;height:150px;border-radius:34px;background:#5b6ad1;display:flex;align-items:center;justify-content:center;gap:12px;flex-shrink:0;box-shadow:0 20px 60px rgba(91,106,209,.45)}
  .logo i{display:block;width:13px;border-radius:7px;background:#fff}
  .txt{margin-left:60px}
  h1{font-size:68px;line-height:1.08;margin:0 0 20px;letter-spacing:-1.5px}
  p{font-size:30px;color:#a9acc8;margin:0;line-height:1.4;max-width:760px}
  .url{position:absolute;left:90px;bottom:48px;font-size:26px;color:#7e8be8;font-weight:600}
</style></head>
<body>
  <div class="logo"><i style="height:34px"></i><i style="height:78px"></i><i style="height:56px"></i><i style="height:100px"></i></div>
  <div class="txt">
    <h1>Video &amp; Ses<br>Transkript Aracı</h1>
    <p>Saniyeler içinde metne çevirin. Hesap yok, kayıt yok. TXT ve SRT olarak indirin.</p>
  </div>
  <div class="url">oguzhandemirbas.com.tr/transkript</div>
</body></html>
