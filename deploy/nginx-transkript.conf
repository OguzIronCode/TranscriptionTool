    # Transkript Araci: ayri uygulama (127.0.0.1:8300), alt yolda yayin (/transkript).
    # Bu blogu mevcut "server { ... listen 443 ssl ... }" icine, "location /" bloklarindan once ekleyin.
    location = /transkript { return 301 /transkript/; }

    location /transkript/ {
        # Yalnizca sayfa (GET/HEAD) ve API (POST) istekleri
        limit_except GET HEAD POST { deny all; }
        # Istek seli korumasi (guvenlik.conf icindeki "sayfa" bolgesi: IP basina 20 istek/sn)
        limit_req zone=sayfa burst=40 nodelay;
        # Sondaki "/" onek (/transkript) kaldirilarak uygulamaya iletilir
        proxy_pass http://127.0.0.1:8300/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # istemcinin kendi X-Forwarded-For basligini degil, gercek adresi ilet (hiz siniri aldatilamasin)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buyuk dosya yuklemeleri: uygulama sinirini (MAX_UPLOAD_MB, varsayilan 500) biraz asan bir deger
        client_max_body_size 520m;
        client_body_timeout 300s;
        # Govdeyi diske tamponlamadan uygulamaya aktar (uygulama boyut/hiz kontrolunu govde okunmadan yapar)
        proxy_request_buffering off;
        # Transkripsiyon ve indirme uzun surebilir
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # Uygulamanin kendi guvenlik basliklari (CSP, Permissions-Policy) gecerli olsun;
        # bu blokta add_header oldugu icin sunucu duzeyindeki basliklar uygulanmaz (cift baslik olusmaz)
        add_header X-Uygulama "transkript" always;
        proxy_hide_header Strict-Transport-Security;
    }
